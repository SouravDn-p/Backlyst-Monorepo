name: backlyst_mobile
description: "BackLyst Mobile Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Routing
  go_router: ^13.0.1

  # UI & Assets
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  flutter_screenutil: ^5.9.0
  gap: ^3.0.0
  cached_network_image: ^3.3.0

  # Icons
  cupertino_icons: ^1.0.6
  lucide_icons: ^0.257.0

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
