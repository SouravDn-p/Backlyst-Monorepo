# ==============================================================================
# Backlyst Backend EC2 - Docker Compose (DEV)
# Instance: i-00bf48d4ad48bac2c (Private IP: 10.1.10.240)
# Managed via: AWS SSM Session Manager
# Secrets via: AWS Secrets Manager (/dev/backlyst/backend)
# ==============================================================================
#
# HOW ENV WORKS:
#   DO NOT create a .env file manually.
#   Before running this file, run the `start.sh` helper script which:
#     1. Fetches secrets from AWS Secrets Manager
#     2. Writes them to a temporary .env file in memory
#     3. Runs docker compose up
#     4. (Optionally) deletes the .env file after startup
#
#   Run: sudo bash /opt/backlyst/backend/start-backend.sh

services:
  backend:
    image: 622711945657.dkr.ecr.eu-west-2.amazonaws.com/backlyst-dev-backend:dev
    container_name: backlyst-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env # Generated automatically by start.sh from AWS Secrets Manager
    environment:
      - NODE_ENV=production
      - PORT=5000
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s



