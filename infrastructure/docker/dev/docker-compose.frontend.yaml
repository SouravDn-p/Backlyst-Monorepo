# ==============================================================================
# Backlyst Frontend EC2 - Docker Compose (DEV)
# Instance: i-036db9583a4b796d1 (Private IP: 10.1.10.228)
# Managed via: AWS SSM Session Manager
# ==============================================================================

services:
  # Next.js Frontend (Port 3000 → ALB routes backlyst.co.uk)
  nextjs:
    image: 622711945657.dkr.ecr.eu-west-2.amazonaws.com/backlyst-dev-frontend:dev
    container_name: backlyst-nextjs
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_BASE_URL=https://api.backlyst.co.uk
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s


  # Admin Dashboard / Vite React App (Port 3043 → ALB routes admin.backlyst.co.uk)
  admin:
    image: 622711945657.dkr.ecr.eu-west-2.amazonaws.com/backlyst-dev-admin-dashboard:dev
    container_name: backlyst-admin
    restart: unless-stopped
    ports:
      - "3043:80" # Nginx inside container serves on port 80, mapped to 3043 on host
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
