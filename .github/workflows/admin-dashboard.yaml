name: Admin Dashboard CI/CD

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "admin-dashboard/**"
      - "infrastructure/docker/**"
      - ".github/workflows/admin-dashboard.yaml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "admin-dashboard/**"
      - "infrastructure/docker/**"
      - ".github/workflows/admin-dashboard.yaml"


permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    name: Build & Push Admin Dashboard Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create temporary .env file
        working-directory: admin-dashboard
        run: touch .env

      - name: Set Environment & Repository Names
        run: |
          echo "COMPOSE_FILE=infrastructure/docker/dev/compose.dev.yaml" >> $GITHUB_ENV
          echo "PROFILE=dev" >> $GITHUB_ENV
          echo "ECR_REPO=backlyst-dev-admin-dashboard" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials (OIDC)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::622711945657:role/backlyst-dev-github-actions-ecr-role
          aws-region: eu-west-2
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          echo "COMPOSE_FILE: $COMPOSE_FILE"
          echo "PROFILE: $PROFILE"
          docker compose -f $COMPOSE_FILE --profile $PROFILE build dashboard

          # Tag for GHCR
          docker tag ghcr.io/backlyst/backlystapp-dashboard:$PROFILE ghcr.io/backlyst/backlystapp-dashboard:${{ github.sha }}

          # Tag for Amazon ECR
          if [ "${{ github.event_name }}" = "push" ]; then
            ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
            docker tag ghcr.io/backlyst/backlystapp-dashboard:$PROFILE $ECR_REGISTRY/$ECR_REPO:$PROFILE
            docker tag ghcr.io/backlyst/backlystapp-dashboard:$PROFILE $ECR_REGISTRY/$ECR_REPO:${{ github.sha }}
          fi

      - name: Push to GitHub Container Registry (GHCR)
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/backlyst/backlystapp-dashboard:$PROFILE
          docker push ghcr.io/backlyst/backlystapp-dashboard:${{ github.sha }}

      - name: Push to Amazon ECR
        if: github.event_name == 'push'
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          docker push $ECR_REGISTRY/$ECR_REPO:$PROFILE
          docker push $ECR_REGISTRY/$ECR_REPO:${{ github.sha }}

  # ============================================================
  # Deploy to Frontend EC2 via AWS SSM (admin runs on same instance)
  # ============================================================
  deploy:
    name: Deploy Admin Dashboard to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::622711945657:role/backlyst-dev-github-actions-ecr-role
          aws-region: eu-west-2
          audience: sts.amazonaws.com

      - name: Copy compose & start script to Frontend EC2 via SSM
        run: |
          COMPOSE_CONTENT=$(cat infrastructure/docker/dev/docker-compose.frontend.yaml | base64 -w 0)
          START_CONTENT=$(cat infrastructure/docker/dev/start-frontend.sh | base64 -w 0)

          COMMAND_ID=$(aws ssm send-command \
            --region eu-west-2 \
            --instance-ids "i-036db9583a4b796d1" \
            --document-name "AWS-RunShellScript" \
            --comment "Backlyst Admin Deploy - ${{ github.sha }}" \
            --parameters "commands=[
              \"mkdir -p /opt/backlyst/frontend\",
              \"echo '$COMPOSE_CONTENT' | base64 -d > /opt/backlyst/frontend/docker-compose.frontend.yaml\",
              \"echo '$START_CONTENT' | base64 -d > /opt/backlyst/frontend/start-frontend.sh\",
              \"chmod +x /opt/backlyst/frontend/start-frontend.sh\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID (copy files): $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-036db9583a4b796d1" \
            --region eu-west-2

          echo "✅ Files copied successfully."

      - name: Run start script on Frontend EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region eu-west-2 \
            --instance-ids "i-036db9583a4b796d1" \
            --document-name "AWS-RunShellScript" \
            --comment "Backlyst Admin Start - ${{ github.sha }}" \
            --parameters "commands=[
              \"bash /opt/backlyst/frontend/start-frontend.sh --update\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID (deploy): $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-036db9583a4b796d1" \
            --region eu-west-2

          echo "✅ Admin Dashboard deployed successfully!"

      - name: Verify container health via SSM
        run: |
          echo "⏳ Waiting for admin container to become healthy..."
          for i in $(seq 1 12); do
            COMMAND_ID=$(aws ssm send-command \
              --region eu-west-2 \
              --instance-ids "i-036db9583a4b796d1" \
              --document-name "AWS-RunShellScript" \
              --comment "Health check attempt $i" \
              --parameters 'commands=["docker inspect --format={{.State.Health.Status}} backlyst-admin 2>/dev/null || echo starting"]' \
              --query "Command.CommandId" \
              --output text)

            aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "i-036db9583a4b796d1" \
              --region eu-west-2

            HEALTH=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-036db9583a4b796d1" \
              --region eu-west-2 \
              --query "StandardOutputContent" \
              --output text | tr -d '[:space:]')

            echo "  Attempt $i/12: Container status = $HEALTH"

            if [ "$HEALTH" = "healthy" ]; then
              echo "✅ Admin container is healthy!"
              exit 0
            fi

            if [ "$HEALTH" = "unhealthy" ]; then
              echo "❌ Container is unhealthy! Fetching logs..."
              COMMAND_ID=$(aws ssm send-command \
                --region eu-west-2 \
                --instance-ids "i-036db9583a4b796d1" \
                --document-name "AWS-RunShellScript" \
                --parameters 'commands=["docker logs --tail 50 backlyst-admin"]' \
                --query "Command.CommandId" \
                --output text)
              aws ssm wait command-executed \
                --command-id "$COMMAND_ID" \
                --instance-id "i-036db9583a4b796d1" \
                --region eu-west-2
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-036db9583a4b796d1" \
                --region eu-west-2 \
                --query "StandardOutputContent" \
                --output text
              exit 1
            fi

            sleep 10
          done

          echo "❌ Timed out waiting for container to become healthy (2 minutes)"
          exit 1
