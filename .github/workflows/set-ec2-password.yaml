name: Set EC2 Instance Password

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      target:
        description: "Target Instance"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - backend
          - frontend

permissions:
  id-token: write
  contents: read

jobs:
  set-password:
    name: Sync EC2 Password from Secrets Manager via SSM
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::622711945657:role/backlyst-${{ github.event.inputs.environment || 'dev' }}-github-actions-ecr-role
          aws-region: eu-west-2
          audience: sts.amazonaws.com

      - name: Fetch Instance IDs by Name Tag and Sync Password from Secrets Manager
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          TARGET="${{ github.event.inputs.target || 'both' }}"

          if [ "$TARGET" = "backend" ]; then
            NAME_VALUES="backlyst-${ENV}-backend"
          elif [ "$TARGET" = "frontend" ]; then
            NAME_VALUES="backlyst-${ENV}-frontend"
          else
            NAME_VALUES="backlyst-${ENV}-backend,backlyst-${ENV}-frontend"
          fi

          echo "🔍 Searching for EC2 instances tagged: $NAME_VALUES (state: running)..."

          INSTANCE_IDS=$(aws ec2 describe-instances \
            --region eu-west-2 \
            --filters "Name=tag:Name,Values=$NAME_VALUES" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "❌ No running instances found matching tag Name: $NAME_VALUES in $ENV"
            exit 1
          fi

          echo "🔐 Found active instance(s): $INSTANCE_IDS"
          echo "🚀 Invoking password sync from AWS Secrets Manager via SSM..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --comment "Sync admin password from Secrets Manager and lock root on $NAME_VALUES" \
            --parameters "commands=[
              \"sudo passwd -l root\",
              \"ADMIN_PASS=\$(aws secretsmanager get-secret-value --secret-id '/${ENV}/backlyst/ec2-admin-password' --region eu-west-2 --query SecretString --output text | python3 -c \\\"import sys, json; print(json.load(sys.stdin).get('EC2_ADMIN_PASSWORD', ''))\\\")\",
              \"if [ -z \\\"\$ADMIN_PASS\\\" ]; then echo '❌ Error: EC2_ADMIN_PASSWORD is empty or not set in Secrets Manager (/${ENV}/backlyst/ec2-admin-password)'; exit 1; fi\",
              \"echo \\\"admin:\$ADMIN_PASS\\\" | sudo chpasswd\",
              \"unset ADMIN_PASS\",
              \"echo '✅ Admin password successfully synced from dedicated Secrets Manager secret.'\"
            ]" \
            --region eu-west-2 \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          # Wait for execution
          for ID in $INSTANCE_IDS; do
            echo "⏳ Waiting for SSM execution on $ID..."
            aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$ID" \
              --region eu-west-2
          done

          echo "✅ Password successfully synced on all target instances ($INSTANCE_IDS)!"
